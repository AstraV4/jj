<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetChef Pro — Ton menu de la semaine, au meilleur prix</title>
    <meta name="description" content="Planifie tes repas de la semaine selon ton budget, ton équipement et tes goûts." />
    <meta name="theme-color" content="#10b981" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Enregistre le service worker (PWA installable + cache), uniquement en https/localhost
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
      }
    </script>
  </body>
</html>
