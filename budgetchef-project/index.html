<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetChef Pro — Ton menu de la semaine, au meilleur prix</title>
    <meta name="description" content="Planifie tes repas de la semaine selon ton budget, ton équipement et tes goûts." />
    <meta name="theme-color" content="#10b981" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // PWA désactivée (fiabilité) : on désinstalle tout service worker existant
      // et on vide les caches, pour éviter toute page blanche due à un cache périmé.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          if (regs.length) {
            // sw.js est en mode auto-destruction : on le (ré)active pour nettoyer proprement.
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          }
        }).catch(() => {});
        if (window.caches && caches.keys) { caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {}); }
      }
    </script>
  </body>
</html>
